[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-harness-agent-lab"
version = "0.1.0"
description = "Hands-on experiments with LLM harnesses and agents"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]